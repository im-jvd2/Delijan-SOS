# ---------------------------------------------------------------------------
# ۱۰. محدودهٔ پوشش (Q-12)
# ---------------------------------------------------------------------------
# پاسخ کارفرما: «تمامی شهرهای اطراف دلیجان + شهرهای نزدیک در استان
#                اصفهان و تهران و قم»
# ⚠ تفسیر اجرایی (نیازمند تأیید):
#    فاصلهٔ دلیجان تا تهران حدود 243 تا 252 کیلومتر است. امداد اضطراری
#    24 ساعته در تهران از پایگاه دلیجان قابل دفاع نیست.
#    → صفحات تهران و کرج با زاویهٔ «حمل خودرو بین شهری» ساخته می‌شوند،
#      نه «امداد خودرو تهران».
service_area:
  tier_1:                                   # امداد اضطراری + حمل
    - { name: "دلیجان",       slug: "",            distance_km: 0,    verified: true }
    - { name: "نراق",         slug: "نراق",      distance_km: 18,   verified: true }
    - { name: "محلات",        slug: "محلات",    distance_km: 40,   verified: false }
    - { name: "سلفچگان",      slug: "سلفچگان", distance_km: 37,   verified: true }
    - { name: "میمه",         slug: "میمه",      distance_km: 115,  verified: false }
  tier_2:
    - { name: "نیم‌ور",        slug: "نیم-ور",      distance_km: 28,   verified: false }
    - { name: "دودهک",        slug: "دودهک",     distance_km: 25,   verified: false }
    - { name: "هستیجان",      slug: "هستیجان",    distance_km: 20,   verified: false }
    - { name: "جاسب",         slug: "جاسب",       distance_km: 22,   verified: false }
    - { name: "جوشق",         slug: "جوشق",     distance_km: 30,   verified: false }
    - { name: "خمین",         slug: "خمین",     distance_km: 75,   verified: false }
    - { name: "دستجرد",       slug: "دستجرد",    distance_km: 55,   verified: false }
    - { name: "کاشان",        slug: "کاشان",      distance_km: 82,   verified: true }
    - { name: "قم",           slug: "قم",        distance_km: 92,   verified: true }
  tier_3:
    - { name: "اراک",         slug: "اراک",        distance_km: 151,  verified: true }
    - { name: "اصفهان",       slug: "اصفهان",     distance_km: 180,  verified: true }
    - { name: "ساوه",         slug: "ساوه",       distance_km: 115,  verified: false }
  intercity_transport_only:                 # فقط حمل، نه امداد اضطراری
    - { name: "تهران",        slug: "تهران",      distance_km: 243,  verified: true }
    - { name: "کرج",          slug: "کرج",       distance_km: 257,  verified: true }
  excluded: []
# verified: true  = عدد از یک سرویس مسیریابی عمومی گرفته شد (مسافت **رانندگی**، نه خط مستقیم)
# verified: false = برآورد تقریبی — پیش از انتشار تأیید شود
#
# ⚠ تفاوت مسافت رانندگی و خط مستقیم:
#    اعداد بالا مسافت **جاده‌ای** هستند. برای نمونه، منابع مرجع فاصلهٔ دلیجان تا قم را
#    80 km و تا اصفهان را 160 km (خط مستقیم) ذکر می‌کنند، در حالی که مسافت رانندگی
#    به‌ترتیب 92 km و 180 km است. در سایت **همیشه مسافت رانندگی** نوشته می‌شود و
#    عبارت «حدود» پیش از عدد می‌آید: «حدود 92 کیلومتر تا قم».

