# ❗ کارفرما «تعمیر در محل وقوع» ارائه نمی‌دهد.
#    خدمت اصلی = حمل خودرو به نزدیک‌ترین تعمیرگاه معتبر.
#    بنابراین کل خوشهٔ «خدمات سیار» (مکانیک سیار، باتری به باتری، پنچرگیری،
#    سوخت‌رسانی، قفل و سوئیچ) از سایت حذف شد.
services:
  offered:
    - { name_fa: "یدک‌کش دلیجان",              slug: "یدک-کش-دلیجان",     priority: "P1" }
    - { name_fa: "خودروبر دلیجان (کفی)",       slug: "خودروبر-دلیجان",      priority: "P1" }
    - { name_fa: "جرثقیل دلیجان",              slug: "جرثقیل-دلیجان",     priority: "P1" }
    - { name_fa: "حمل خودرو دلیجان",           slug: "حمل-خودرو-دلیجان",    priority: "P1" }
    - { name_fa: "حمل خودرو به تعمیرگاه",      slug: "حمل-خودرو-به-تعمیرگاه",       priority: "P1" }
    - { name_fa: "حمل خودرو بین شهری",         slug: "حمل-خودرو-بین-شهری",       priority: "P1" }
    - { name_fa: "چرخگیر دلیجان",              slug: "چرخگیر-دلیجان",      priority: "P2" }
    - { name_fa: "حمل خودرو تصادفی",           slug: "حمل-خودرو-تصادفی",   priority: "P2" }
    - { name_fa: "حمل خودرو صفر و لوکس",       slug: "حمل-خودرو-صفر",       priority: "P3" }
    - { name_fa: "امداد خودرو برندها",         slug: "امداد-خودرو-برندها",         priority: "P3" }
  not_offered:                            # ⛔ برای این‌ها صفحه ساخته نمی‌شود
    - "مکانیک سیار / تعمیر در محل"
    - "باتری به باتری"
    - "پنچرگیری و آپاراتی سیار"
    - "سوخت‌رسانی سیار"
    - "بازکردن درب و خدمات قفل و سوئیچ"
