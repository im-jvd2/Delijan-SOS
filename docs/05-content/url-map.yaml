# ============================================================================
#  URL Map — نگاشت آدرس‌های لاتین ← فارسی
#  Delijan-SOS Project
# ============================================================================
#  🔴 این فایل «منبع حقیقت» آدرس‌هاست (D-025).
#     هر آدرسی که در هر فایلی نوشته می‌شود باید از همین‌جا کپی شود.
#
#  چرا فارسی؟
#    کارفرما 1405-06-25: «URLها همه فینگلیش هستند! این خوب نیست! مسخرمون میکنن!»
#    → تصمیم D-025: آدرس‌ها فارسی شدند.
#
#  قواعد اسلاگ فارسی:
#    1. فقط حروف فارسی + خط تیرهٔ لاتین `-`
#    2. ⛔ نیم‌فاصله (U+200C) ممنوع — به‌جایش خط تیره: «یدک-کش» نه «یدک‌کش»
#       (نیم‌فاصله در URL به %E2%80%8C تبدیل می‌شود و زشت و شکننده است)
#    3. ⛔ فاصلهٔ معمولی ممنوع
#    4. ⛔ «کسره» (ـ) در ابتدای اسلاگ ممنوع
#    5. اعداد لاتین می‌مانند: `هزینه-امداد-خودرو-1405`
#    6. اسلش انتهایی الزامی: `/مناطق/نراق/`
#    7. همه lowercase (فارسی بزرگ/کوچک ندارد، اما لاتین‌های باقی‌مانده باید کوچک باشند)
#
#  ⚠ وردپرس این آدرس‌ها را به‌صورت percent-encoded ذخیره می‌کند
#     (`/%D9%85%D9%86%D8%A7%D8%B7%D9%82/%D9%86%D8%B1%D8%A7%D9%82/`)
#     اما گوگل و مرورگرها آن را **فارسی و خوانا** نمایش می‌دهند.
# ============================================================================

meta:
  decision: "D-025"
  decided_on: "1405-06-25"
  replaces: "D-002 (اسلاگ لاتین) — باطل شد"
  digits: "latin"
