# ---------------------------------------------------------------------------
# ۱۰. الزامات پیاده‌سازی در وردپرس
# ---------------------------------------------------------------------------
implementation:
  permalink_structure: "/%category%/%postname%/ برای نوشته‌ها · برگه‌ها دستی"
  encoding_note: |
    وردپرس اسلاگ فارسی را percent-encoded ذخیره می‌کند. این طبیعی است.
    در `wp_options` مقدار `permalink_structure` همان الگوی بالا می‌ماند.
  redirects: |
    چون سایت هنوز لانچ نشده، هیچ 301 لازم نیست.
    اگر بعداً اسلاگی عوض شد، با افزونهٔ Redirection یک 301 زده می‌شود.
  rank_math: "Rank Math اسلاگ فارسی را درست در sitemap و canonical می‌گذارد — تنظیم اضافی لازم نیست."
  forbidden_in_slug:
    - "نیم‌فاصله U+200C"
    - "فاصلهٔ معمولی"
    - "حروف لاتین (مگر اعداد)"
    - "کسرهٔ آغازین"
